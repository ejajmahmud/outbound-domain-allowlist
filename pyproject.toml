[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-domain-allowlist"
version = "0.1.0"
description = "Strict network egress proxy validating outbound HTTP destinations against strict wildcard allowlists with DNS rebinding protection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
outbound-domain-allowlist = "outbound_domain_allowlist.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["outbound_domain_allowlist*"]
